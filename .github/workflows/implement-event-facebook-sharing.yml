name: Implement event Facebook sharing

on:
  push:
    branches:
      - feature/event-facebook-sharing
    paths:
      - ".github/workflows/implement-event-facebook-sharing.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/event-facebook-sharing

      - name: Apply implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/calendar.js')
          text = path.read_text()

          old = '''  function cell(row, text, label) {\n    const td = document.createElement('td');\n    td.dataset.label = label;\n    td.textContent = text;\n    row.appendChild(td);\n    return td;\n  }\n  function render(events) {'''
          new = '''  function cell(row, text, label) {\n    const td = document.createElement('td');\n    td.dataset.label = label;\n    td.textContent = text;\n    row.appendChild(td);\n    return td;\n  }\n  function eventShareUrl(eventId) {\n    return new URL(`share/events/${encodeURIComponent(eventId)}.html`, document.baseURI);\n  }\n  function facebookShareUrl(shareUrl) {\n    const url = new URL('https://www.facebook.com/sharer/sharer.php');\n    url.searchParams.set('u', shareUrl.href);\n    return url.href;\n  }\n  async function addFacebookShareButton(event, row, target) {\n    if (!event.id) return;\n    const shareUrl = eventShareUrl(event.id);\n    try {\n      let response = await fetch(shareUrl, { method: 'HEAD', cache: 'no-store' });\n      if (response.status === 405) {\n        response = await fetch(shareUrl, { method: 'GET', cache: 'no-store' });\n      }\n      if (!response.ok || !row.isConnected) return;\n    } catch (error) {\n      console.info('Facebook share artifact is not available yet for this event.');\n      return;\n    }\n    const actions = document.createElement('div');\n    actions.className = 'event-actions';\n    const link = document.createElement('a');\n    link.className = 'button';\n    link.href = facebookShareUrl(shareUrl);\n    link.target = '_blank';\n    link.rel = 'noopener noreferrer';\n    link.textContent = 'Share to Facebook';\n    link.setAttribute('aria-label', `Share ${event.title || 'this event'} to Facebook`);\n    actions.appendChild(link);\n    target.appendChild(actions);\n  }\n  function render(events) {'''
          if old not in text: raise SystemExit('cell/render pattern not found')
          text = text.replace(old, new, 1)

          old = '''    events.forEach((event) => {\n      const row = document.createElement('tr');\n      const startDay = dateLabel(event.start, event.allDay);'''
          new = '''    const shareTargets = [];\n    events.forEach((event) => {\n      const row = document.createElement('tr');\n      row.id = event.id || '';\n      const startDay = dateLabel(event.start, event.allDay);'''
          if old not in text: raise SystemExit('event row pattern not found')
          text = text.replace(old, new, 1)

          old = '''        details.append(summary, description);\n        title.appendChild(details);\n      }\n      fragment.appendChild(row);\n    });\n    rows.replaceChildren(fragment);'''
          new = '''        details.append(summary, description);\n        title.appendChild(details);\n      }\n      if (event.id) shareTargets.push({ event, row, target: title });\n      fragment.appendChild(row);\n    });\n    rows.replaceChildren(fragment);\n    shareTargets.forEach(({ event, row, target }) => {\n      addFacebookShareButton(event, row, target);\n    });'''
          if old not in text: raise SystemExit('render end pattern not found')
          text = text.replace(old, new, 1)

          old = '''        data.items.filter((item) => item.status !== 'cancelled').forEach((item) => {\n          const metadata = window.KCWEventDescription.metadata(item.description);\n          if (!window.KCWEventDescription.isPublic(metadata)) return;\n          const start = Date.parse(item.start?.dateTime || item.start?.date);\n          const end = Date.parse(item.end?.dateTime || item.end?.date);\n          if (!Number.isFinite(start) || !Number.isFinite(end)) throw new Error('Invalid event date');\n          events.push({ title: item.summary || '', description: item.description || '',\n            start, end, allDay: Boolean(item.start.date) });\n        });'''
          new = '''        data.items.filter((item) => item.status !== 'cancelled').forEach((item) => {\n          const metadata = window.KCWEventDescription.metadata(item.description);\n          if (!window.KCWEventDescription.isPublic(metadata)) return;\n          const eventId = typeof item.id === 'string' ? item.id.trim() : '';\n          if (!eventId) return;\n          const start = Date.parse(item.start?.dateTime || item.start?.date);\n          const end = Date.parse(item.end?.dateTime || item.end?.date);\n          if (!Number.isFinite(start) || !Number.isFinite(end)) throw new Error('Invalid event date');\n          events.push({ id: eventId, title: item.summary || '', description: item.description || '',\n            start, end, allDay: Boolean(item.start.date) });\n        });'''
          if old not in text: raise SystemExit('calendar item pattern not found')
          text = text.replace(old, new, 1)

          path.write_text(text)

          docs = Path('EVENT-FACEBOOK-SHARING.md')
          docs.write_text('''# Per-event Facebook sharing\n\nThe public Schedule & Events calendar exposes **Share to Facebook** only for upcoming Published Google Calendar events whose generated share artifact has already reached this site.\n\nThe browser checks for `share/events/<google-calendar-event-id>.html`. If the file exists, the button opens Facebook's standard sharer in a new tab. The KCW site never authenticates the visitor with Facebook and never posts on the visitor's behalf.\n\nThe Google Calendar event ID is also assigned to the rendered event row, so a generated share artifact can redirect human visitors to `schedule.html#<event-id>`.\n\nShare artifacts are generated by Calendar Manager and synchronized into the `dev` branch. They then follow the normal KCW dev → UAT → main promotion process. Archived, Draft, and cancelled events do not appear in this upcoming public calendar, so they do not receive a Share button. Existing share files are intentionally retained so older Facebook posts do not break.\n''')
          PY

      - name: Validate implementation
        run: |
          node --check scripts/calendar.js
          npm run test:content
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name "KCW Implementation Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/calendar.js EVENT-FACEBOOK-SHARING.md
          git commit -m "Add per-event Facebook share buttons"
          git push origin HEAD:feature/event-facebook-sharing
